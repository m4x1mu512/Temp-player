name: Android CI

on:
  push:
    branches: [ "chatGPT" ]
  pull_request:
    branches: [ "chatGPT" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: chatGPT

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Generate CI debug keystore
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -v \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          cp ~/.android/debug.keystore ./debug.keystore

      - name: Build Debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Run Kotlin unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      # Generate a disposable CI-only signing key. It is never used for Play
      # uploads and is not retained as a repository secret or artifact.
      - name: Create temporary CI release signing key
        run: |
          keytool -genkeypair -v \
            -storetype JKS \
            -keystore "$GITHUB_WORKSPACE/ci-release-key.jks" \
            -storepass ci-only-store-password \
            -alias ci-release \
            -keypass ci-only-key-password \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Temporary CI Key,O=CI,C=US"
          cat > keystore.properties <<EOF
          storeFile=$GITHUB_WORKSPACE/ci-release-key.jks
          storePassword=ci-only-store-password
          keyAlias=ci-release
          keyPassword=ci-only-key-password
          EOF

      # These CI-signed artifacts are for installation/testing only. Use your
      # own backed-up upload key locally for the actual Google Play submission.
      - name: Build release APK and Google Play AAB
        run: ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-builds
          if-no-files-found: error
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
