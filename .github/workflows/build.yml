name: Android CI

on:
  push:
    branches: [ "chatGPT" ]
  pull_request:
    branches: [ "chatGPT" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: chatGPT

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Generate CI debug keystore
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -v \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          cp ~/.android/debug.keystore ./debug.keystore

      - name: Build Debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Run Kotlin unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      # No release keystore is stored in GitHub. This validates the real release
      # variant (including R8/resource shrinking) and produces an unsigned AAB.
      - name: Build Google Play release bundle (unsigned in CI)
        run: ./gradlew --no-daemon bundleRelease

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-builds
          if-no-files-found: error
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/bundle/release/*.aab
